<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Message frame</title><link rel="stylesheet" href="/fixture.css"></head>
<body style="padding: 8px 14px">
  <label for="message">Message</label>
  <input id="message" type="text" autocomplete="off">
  <button id="send" type="button">Send to parent</button>
  <p id="frame-status" role="status">Nothing sent</p>
  <script>
    const parentOrigin = new URLSearchParams(location.search).get('parentOrigin');
    document.getElementById('send').addEventListener('click', () => {
      const text = document.getElementById('message').value;
      document.getElementById('frame-status').textContent = `Sent: ${text}`;
      if (parentOrigin) parent.postMessage(text, parentOrigin);
    });
  </script>
</body>
</html>
