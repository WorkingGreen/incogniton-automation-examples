<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Counter frame</title><link rel="stylesheet" href="/fixture.css"></head>
<body style="padding: 8px 14px">
  <button id="increment" type="button" disabled>Increment</button>
  <p id="count" role="status">Count: 0</p>
  <script>
    let count = 0;
    const button = document.getElementById('increment');
    // The button becomes usable only after the frame finished "initialising".
    setTimeout(() => { button.disabled = false; }, 300);
    button.addEventListener('click', () => {
      count += 1;
      document.getElementById('count').textContent = `Count: ${count}`;
    });
  </script>
</body>
</html>
